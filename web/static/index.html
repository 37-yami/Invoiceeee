<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生报销管家</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>学生报销管家</h1>
  <span class="muted">本地运行 · 数据未离开本机</span>
</header>

<nav id="tabs">
  <button data-tab="upload" class="active">上传/待确认</button>
  <button data-tab="library">票据库</button>
  <button data-tab="report">生成汇总单</button>
  <button data-tab="settings">设置</button>
</nav>

<!-- 上传 / 待确认 -->
<section id="tab-upload" class="tab active">
  <div id="drop-zone" class="zone">拖拽票据图片到这里,或
    <label class="btn">选择/拍照
      <input id="file-input" type="file" accept="image/*" multiple
             capture="environment" hidden>
    </label>
  </div>
  <div class="row">
    <select id="upload-category" aria-label="上传类别">
      <option value="">自动识别(可选类别)</option>
    </select>
    <button id="upload-btn" class="primary">上传</button>
  </div>
  <p id="upload-msg" class="msg"></p>
  <h2>待确认 <span id="pending-count" class="muted"></span></h2>
  <div id="pending-list" class="list"></div>
</section>

<!-- 票据库 -->
<section id="tab-library" class="tab">
  <div class="filters">
    <select id="f-status">
      <option value="">全部状态</option>
      <option value="confirmed">已确认</option>
      <option value="pending">待确认</option>
    </select>
    <select id="f-category"><option value="">全部类别</option></select>
    <input id="f-from" type="date" aria-label="起">
    <span>—</span>
    <input id="f-to" type="date" aria-label="止">
    <input id="f-q" placeholder="搜商户/发票号/备注">
    <button id="f-apply" class="primary">筛选</button>
  </div>
  <p id="library-summary" class="muted"></p>
  <div id="library-list" class="list"></div>
</section>

<!-- 生成汇总单 -->
<section id="tab-report" class="tab">
  <p class="muted">先在「票据库」勾选票据,再回这里生成。</p>
  <div id="report-summary" class="card"></div>
  <div class="meta-form card">
    <label>报销人 <input id="m-name"></label>
    <label>学号/工号 <input id="m-sid"></label>
    <label>项目/课题组 <input id="m-project"></label>
    <label>出差起 <input id="m-from" type="date"></label>
    <label>出差止 <input id="m-to" type="date"></label>
    <label>出差事由 <input id="m-reason"></label>
  </div>
  <div class="row">
    <button id="preview-btn">预览合计</button>
    <button id="docx-btn" class="primary">生成 docx</button>
    <button id="csv-btn">导出 CSV</button>
  </div>
  <div id="report-result" class="msg"></div>
</section>

<!-- 设置 -->
<section id="tab-settings" class="tab">
  <div class="card">
    <label>默认报销人 <input id="s-name"></label>
    <label>默认学号/工号 <input id="s-sid"></label>
    <label>默认项目/课题组 <input id="s-project"></label>
    <label>本地 OCR 命令(可选,含 {image} 占位)
      <input id="s-ocr" placeholder="例:tesseract {image} stdout -l chi_sim">
    </label>
    <button id="settings-save" class="primary">保存</button>
    <p id="settings-msg" class="msg"></p>
  </div>
  <p class="muted">备份:直接复制整个工作区目录。删除的票据在 .trash/ 里。</p>
</section>

<!-- 局域网访问码 -->
<div id="code-dialog" hidden>
  <div class="card">
    <p>请输入访问码(见启动命令行)</p>
    <input id="code-input" inputmode="numeric" maxlength="6" autofocus>
    <button id="code-submit" class="primary">进入</button>
    <p id="code-error" class="msg"></p>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
